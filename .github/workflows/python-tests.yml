name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/virtual-creator-studio
      - feature/provider-orchestrator-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Run tests
        run: python -m pytest -q --tb=short
