name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/virtual-creator-studio
      - feature/provider-orchestrator-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt

      - name: Run tests
        run: |
          set +e
          python -m pytest -q --tb=short > pytest-output.txt 2>&1
          echo $? > pytest-exit-code.txt
          exit 0

      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt

      - name: Set final test status
        if: always()
        run: |
          cat pytest-output.txt
          exit "$(cat pytest-exit-code.txt)"
