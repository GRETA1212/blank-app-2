name: Studio Control Center CI

on:
  push:
    branches: [main, feature/local-ai-studio]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/orchestrator/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -c "from app.main import app; assert app.title == 'Studio Orchestrator'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.local.example .env
      - run: docker compose -f docker-compose.local.yml config
