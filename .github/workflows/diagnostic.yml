name: Compact Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [feature/local-ai-studio]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --silent
      - run: npm run build

  backend-tests:
    runs-on: ubuntu-latest
    env:
      ASSET_ROOT: /tmp/studio-assets
      MEDIA_OUTPUT_ROOT: /tmp/studio-media-output
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements-dev.txt
      - run: pytest -q

  media-tests:
    runs-on: ubuntu-latest
    env:
      OUTPUT_ROOT: /tmp/studio-output
      VOICE_ROOT: /tmp/studio-voices
      ASSET_ROOT: /tmp/studio-assets
      WHISPER_ROOT: /tmp/studio-whisper
      PIPER_AUTO_DOWNLOAD: 'false'
    defaults:
      run:
        working-directory: services/media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements-dev.txt
      - run: pytest -q
