name: Fit360 CI

on:
  push:
    branches: ["fit360-mvp"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/app/main.py backend/app/phase2.py
      - name: Import app and phase-two routes
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app
          assert app.title == 'Fit360 AI API'
          paths = {route.path for route in app.routes}
          required = {
              '/api/body-profile/{user_id}',
              '/api/catalog',
              '/api/fit/recommend',
              '/api/catalog/complete-look',
              '/api/multiview',
          }
          assert required.issubset(paths), required - paths
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
